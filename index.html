<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ECEEF3" />
    <script src="/theme.js"></script>
    <style>
      html { background: #eceef3; }
      html[data-theme='dark'] { background: #0c0d12; color-scheme: dark; }
      /* Startup screen: shown from the first paint, before any script; the app removes it once a page is ready
         (App.tsx › Loading draws the same one later). Plain CSS here: index.css isn't there yet in development. */
      .boot { position: fixed; inset: 0; z-index: 90; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #eceef3; color: #14161f; font: 600 17px/20px ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: -0.035em; -webkit-font-smoothing: antialiased; }
      .boot svg { display: block; overflow: visible; }
      .boot-tile { fill: #14161f; }
      .boot-me { fill: #eceef3; }
      .boot-friend { fill: #3d63dd; animation: boot-friend 1.8s ease-in-out infinite; }
      [data-theme='dark'] .boot { background: #0c0d12; color: #f1f2f6; }
      [data-theme='dark'] .boot-tile { fill: #f1f2f6; }
      [data-theme='dark'] .boot-me { fill: #0c0d12; }
      /* The style's page colour (Profil › Apparence), so the app doesn't jump from one grey to another. */
      html[data-style='verre'], [data-style='verre'] .boot, [data-style='verre'] .boot-me { background: #e7eaf6; fill: #e7eaf6; }
      html[data-style='liquide'], [data-style='liquide'] .boot, [data-style='liquide'] .boot-me { background: #eceef2; fill: #eceef2; }
      html[data-style='relief'], [data-style='relief'] .boot, [data-style='relief'] .boot-me { background: #e4e9f2; fill: #e4e9f2; }
      html[data-style='verre'][data-theme='dark'], [data-style='verre'][data-theme='dark'] .boot, [data-style='verre'][data-theme='dark'] .boot-me { background: #0b0d18; fill: #0b0d18; }
      html[data-style='liquide'][data-theme='dark'], [data-style='liquide'][data-theme='dark'] .boot, [data-style='liquide'][data-theme='dark'] .boot-me { background: #111215; fill: #111215; }
      html[data-style='relief'][data-theme='dark'], [data-style='relief'][data-theme='dark'] .boot, [data-style='relief'][data-theme='dark'] .boot-me { background: #1e2126; fill: #1e2126; }
      /* The small dot (the friend) leans towards the big one (you), and back. */
      @keyframes boot-friend { 50% { transform: translate(-1.25px, 1.25px); } }
      @media (prefers-reduced-motion: reduce) { .boot-friend { animation: none; } }
      .reduce-motion .boot-friend { animation: none; }
    </style>
    <noscript><style>.boot { display: none; }</style></noscript>
